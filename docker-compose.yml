# File created with guidance from ChatGPT (GPT-5.2 with project context)
services:
  db:
    image: postgres:18.2-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER2: ${POSTGRES_USER2}
      POSTGRES_PASSWORD2: ${POSTGRES_PASSWORD2}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: ${POSTGRES_DB_URL}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT}:${API_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${API_PORT}/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  pipelines:
    build: ./pipelines
    environment:
      # These variables will have different values in dev and prod
      DATABASE_URL: ${POSTGRES_DB_URL}
      AWS_ENDPOINT_URL_S3: ${S3_ENDPOINT}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET}
      PIPELINES_CRAWLER_CONTACT: ${PIPELINES_CRAWLER_CONTACT}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  objdata:
